[package]
name = "zerostack-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "GPUI desktop frontend for zerostack"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zerostack-gui"
path = "src/main.rs"

[features]
# Enables the Wasm extension registry inside the GUI. Mirrors the
# equivalent flag on `zerostack-core`. When this is off the GUI builds
# without any of the extension code paths and `#[cfg(feature =
# "extensions")]` blocks in `view.rs` collapse to empty. Note this is
# purely a source-gate; the `extensions` feature on `zerostack-core` is
# enabled *unconditionally* via the dep below so that the linker has
# the extension symbols available — this flag is what the `view.rs`
# code-gates look at.
extensions = []
default = ["extensions"]

[dependencies]
zerostack-core = { path = "../core", default-features = false, features = [
  "extensions",
  "mcp",
] }
gpui = { git = "https://github.com/egoist/zed" }
gpui_platform = { git = "https://github.com/egoist/zed" }
gpui_macros = { git = "https://github.com/egoist/zed" }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
compact_str = { version = "0.9", features = ["serde"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/egoist/zed", features = [
  "font-kit",
  "runtime_shaders",
] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { git = "https://github.com/egoist/zed" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { git = "https://github.com/egoist/zed" }
