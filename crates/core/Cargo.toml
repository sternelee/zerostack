[package]
name = "zerostack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Core engine for zerostack — agent, tools, sessions, config, permissions"

[features]
default = [
  'loop',
  'git-worktree',
  'mcp',
  'subagents',
  'archmd',
  'status-signals',
  'multithread',
  'extensions',
]
status-signals = []
loop = []
git-worktree = []
mcp = [
  "dep:rmcp",
  "rmcp?/client",
  "rmcp?/transport-child-process",
  "rmcp?/transport-streamable-http-client-reqwest",
  "rmcp?/auth",
]
acp = ["dep:agent-client-protocol", "dep:blocking"]
memory = []
subagents = []
archmd = []
multithread = ["tokio/rt-multi-thread"]
multimodal = ["rig/image"]
pdf = ["multimodal", "rig/pdf"]
advisor = []
extensions = ["dep:wasmtime", "dep:wasmtime-wasi", "zerostack-extension-api"]
hooks = []

[dependencies]
rig = { version = "0.40", features = ["rmcp"] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "2.0", optional = true, default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "sync",
  "time",
  "process",
  "fs",
] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
reqwest = "0.13"
dirs = "6"
compact_str = { version = "0.9", features = ["serde"] }
smallvec = "1"
regex = "1"
unicode-width = "0.2"
ignore = "0.4"
pulldown-cmark = "0.13"
include_dir = "0.7"
http = "1"
agent-client-protocol = { version = "1.0.1", optional = true }
blocking = { version = "1", optional = true }
mimalloc = { version = "0.1", default-features = false }
wasmtime = { version = "46", optional = true, default-features = false, features = [
  "runtime",
  "cranelift",
  "component-model",
] }
wasmtime-wasi = { version = "46", optional = true, default-features = false, features = [
  "p2",
] }
zerostack-extension-api = { path = "../extension-api", optional = true }
