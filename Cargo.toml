[workspace]
members = [".", "crates/extension-api", "crates/gui", "tests/extensions/test-echo", "tests/extensions/pi-simplify"]
default-members = [".", "crates/extension-api", "crates/gui"]
resolver = "3"

[workspace.package]
version = "1.7.0-rc1"
edition = "2024"
license = "GPL-3.0-only"
homepage = "https://github.com/gi-dellav/zerostack"
repository = "https://github.com/gi-dellav/zerostack"

[package]
name = "zerostack"
version.workspace = true
edition.workspace = true
authors = ["Giuseppe Della Vedova"]
description = "Minimalistic coding agent written in Rust, optimized for memory footprint and performance"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ai", "cli", "dev"]

[features]
default = ['loop', 'git-worktree', 'mcp', 'subagents', 'archmd', 'status-signals', 'multithread', 'extensions']
status-signals = []
loop = []
git-worktree = []
mcp = [
    "dep:rmcp",
    "rmcp?/client",
    "rmcp?/transport-child-process",
    "rmcp?/transport-streamable-http-client-reqwest",
    "rmcp?/auth",
]
acp = ["dep:agent-client-protocol", "dep:blocking"]
memory = []                              
subagents = []
archmd = []
multithread = ["tokio/rt-multi-thread"]  
multimodal = ["rig/image"]               
pdf = ["multimodal", "rig/pdf"]   
advisor = []
extensions = ["dep:wasmtime", "dep:wasmtime-wasi", "zerostack-extension-api"]
hooks = []

[dependencies]
rig = { version = "0.39", features = ["rmcp"] }
rmcp = { version = "2.0", optional = true, default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "time",
    "process",
    "fs",
] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
reqwest = "0.13"
dirs = "6"
compact_str = { version = "0.9", features = ["serde"] }
smallvec = "1"
regex = "1"
unicode-width = "0.2"
ignore = "0.4"
pulldown-cmark = "0.13"
include_dir = "0.7"
http = "1"
agent-client-protocol = { version = "1.0.1", optional = true }
blocking = { version = "1", optional = true }
mimalloc = { version = "0.1", default-features = false }
wasmtime = { version = "46", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model"] }
wasmtime-wasi = { version = "46", optional = true, default-features = false, features = ["p2"] }
zerostack-extension-api = { path = "crates/extension-api", optional = true }

[profile.dev]
opt-level = 1
debug = false
codegen-units = 16
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
debug = false
